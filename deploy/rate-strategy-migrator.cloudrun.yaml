##############################################################################
# Cloud Run service definition — guesty-rate-strategy-migrator
#
# Deploy / update with:
#   gcloud run services replace deploy/rate-strategy-migrator.cloudrun.yaml \
#     --region us-central1
#
# Before deploying, replace ALL placeholder values:
#   PROJECT_ID   — your GCP project ID
#   REGION       — your GCP region (e.g. us-central1)
#   REPO         — your Artifact Registry repo name (e.g. guesty-migrate)
#   IMAGE_TAG    — image tag from Cloud Build ($SHORT_SHA or "latest")
#   CONNECTOR_NAME — your Serverless VPC Access connector name
#
# DATABASE_URL format for Cloud SQL Auth Proxy (Unix socket):
#   postgresql://guesty_app:PASSWORD@/guesty_migrate?host=/cloudsql/PROJECT_ID:REGION:guesty-migrate-db
#   No DB_SSL needed — the Auth Proxy socket is not SSL.
#
# IMPORTANT — Memorystore (Redis) requires a Serverless VPC Access Connector.
# See deploy/README.md Step 6 for setup instructions.
##############################################################################

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: guesty-rate-strategy-migrator
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Keep at least one instance warm so the Bull worker is always running
        autoscaling.knative.dev/minScale: "1"
        # Limit to 2 instances — Playwright is CPU/memory intensive
        autoscaling.knative.dev/maxScale: "2"
        # Cloud SQL Auth Proxy — injects Unix socket at
        #   /cloudsql/PROJECT_ID:REGION:guesty-migrate-db
        # Required for the Unix-socket DATABASE_URL to work.
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:guesty-migrate-db
        # VPC connector — required to reach Memorystore (private IP only).
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/CONNECTOR_NAME
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: guesty-migrate-sa@PROJECT_ID.iam.gserviceaccount.com
      # Process one migration at a time per instance (Playwright singleton)
      containerConcurrency: 1
      timeoutSeconds: 3600   # 1 hour — individual migration jobs can take ~10 min
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPO/guesty-rate-strategy-migrator:IMAGE_TAG
          ports:
            - containerPort: 3000
          resources:
            limits:
              # Playwright + Chromium requires at least 2 GB RAM
              cpu: "2"
              memory: 2Gi
          env:
            # ── Non-secret runtime config ─────────────────────────────────
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HEADLESS
              value: "true"
            - name: BROWSER_TIMEOUT_MS
              value: "15000"
            - name: JOB_TIMEOUT_MS
              value: "600000"
            - name: LOG_LEVEL
              value: info
            - name: ENABLE_UI_VALIDATION
              value: "false"
            - name: GUESTY_APP_URL
              value: https://app.guesty.com
            # ── Required secrets from Secret Manager ──────────────────────
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL
                  key: latest
            - name: PAYLOAD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: PAYLOAD_ENCRYPTION_KEY
                  key: latest
